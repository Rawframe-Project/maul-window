# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longest. Each desktop build cell is a
# CMake preset built by the organization's shared workflow; the platform
# cells that need a simulator, an emulator or a browser, and the other
# jobs, are here, each through its preset too. docs/operations/checks.md
# explains each job, and tools/check.sh runs the Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_WINDOW
  CCACHE_MAXSIZE: 2G

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@89f98d8066ba5deec132332fba9f0b0347aecc01 # v0.0.40
    permissions:
      pull-requests: read

  # The organization's documentation check, run from the pinned commit of
  # .github. protocols/, tools/gamepaddb/ and tools/androidkeys/ hold
  # third-party files kept as published.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rawframe-Project/.github/.github/actions/docs-check@89f98d8066ba5deec132332fba9f0b0347aecc01 # v0.0.40
        with:
          exclude: protocols tools/gamepaddb tools/androidkeys

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@89f98d8066ba5deec132332fba9f0b0347aecc01 # v0.0.40
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, test hygiene and labels,
  # the documentation site, the generated tables, and clang-tidy over the
  # Linux build's sources. It runs on documentation changes too, since the
  # snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files 'include/*.h' 'src/*.[chm]' 'test/*.[chm]' 'tools/*.[ch]' 'bench/*.[ch]' 'samples/*.[ch]' |
            grep -v -E '^(tools/gamepaddb|tools/androidkeys)/' | xargs clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      # Every test registration, in the configurations this image can
      # configure: the Linux backends, the shared build's exports test, the
      # build without a backend and the web backend's wasm32-wasi tests.
      - name: Test hygiene
        run: |
          python3 tools/check_test_hygiene.py --self-test
          python3 tools/check_test_hygiene.py
          for preset in linux-clang-20-asan linux-shared linux-minimal web-wasi; do
            cmake --preset "$preset" >/dev/null
            python3 tools/check_test_hygiene.py --ctest "out/$preset"
          done
      - name: The iOS runner against a stand-in simulator
        run: tools/test_run_ios_app.sh
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: Generated tables match their generators
        run: |
          mkdir -p out/regenerated
          python3 tools/gen_gamepad_db.py Linux out/regenerated/pad_linux.c
          python3 tools/gen_gamepad_db.py Windows out/regenerated/pad_windows.c
          python3 tools/gen_android_keys.py out/regenerated/android_keys.c
          for f in pad_linux.c pad_windows.c android_keys.c; do
            diff -u "src/generated/$f" "out/regenerated/$f"
          done
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-checks-${{ github.sha }}
          restore-keys: ccache-checks-
      - name: clang-tidy
        # The Linux build's sources; the other platforms' code is compiled
        # with warnings as errors by its own cell. On a Release build,
        # where the assertions compile out, and on a Debug build, where
        # they trap: each hides findings the other shows.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats >/dev/null
          for build in Release Debug; do
            echo "== $build"
            cmake --preset linux-clang-20 -B "out/tidy-$build" -DCMAKE_BUILD_TYPE=$build \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -D${PREFIX}_BUILD_TESTS=OFF
            cmake --build "out/tidy-$build"
            tools/run_tidy.sh "out/tidy-$build"
          done
          ccache --show-stats
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-checks-${{ github.sha }}

  # Every cell builds with warnings as errors and runs its whole suite, the
  # header tests included. The Linux cells run the X11 and Wayland tests
  # against an Xvfb and a headless weston that ctest starts for them.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-minimal }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@89f98d8066ba5deec132332fba9f0b0347aecc01 # v0.0.40
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # Each fuzz target runs over the bytes other programs and devices hand
  # the library, from its committed seeds: briefly on a pull request, longer
  # on main. The nightly run is fuzz-nightly.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-
      - name: Build
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats >/dev/null
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -D${PREFIX}_FUZZ=ON -D${PREFIX}_TEST_BACKEND=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
          ccache --show-stats
      - name: Save ccache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-fuzz-${{ github.sha }}
      - name: Run
        # As many targets at a time as the runner has cores; each keeps its
        # full time. tools/fuzz_target.sh reports a finding without its
        # input, and keeps the input and the log on the runner; the reports
        # are printed once every target has finished.
        run: |
          rm -rf out/fuzz-reports
          status=0
          printf '%s\n' out/fuzz/fuzz_* | xargs -P "$(nproc)" -I {} bash -c '
            name=$(basename "$1")
            mkdir -p "out/corpus/$name"
            seeds=()
            [ -d "test/seeds/$name" ] && seeds=("test/seeds/$name")
            tools/fuzz_target.sh "$1" -max_total_time="$FUZZ_SECONDS" -max_len=256 \
              "out/corpus/$name" "${seeds[@]}"' _ {} || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"

  # The fuzz targets, one per test/fuzz_*.c, for fuzz-nightly's matrix.
  fuzz-targets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "targets=$(cd test && ls fuzz_*.c | sed 's/\.c$//' | jq -R . | jq -cs .)" >>"$GITHUB_OUTPUT"

  # Every night each target fuzzes ten minutes from its corpus of the nights
  # before, carried in an Actions cache, in a job of its own so that every
  # target runs at once. The cache is keyed by the target and by the fuzz
  # build's inputs (the library, its CMake, the target and the compiler), so
  # an unchanged build restores its own corpus exactly. A target whose build
  # changed restores its latest corpus of an earlier build: a corpus is only
  # inputs, which stay valid against a new binary. After the run the
  # fuzzer's merge minimizes the seeds and the corpus together against this
  # binary, and the result is saved for the next night, only by a run that
  # found nothing. The summary compares the seeds' coverage with the
  # corpus's. Nothing is uploaded: a finding, a log and a corpus hold
  # inputs, and the Actions cache and artifacts are not secret.
  fuzz-nightly:
    needs: fuzz-targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          INPUTS: ${{ hashFiles('src/**', 'include/**', 'protocols/**', 'cmake/**', 'CMakeLists.txt', format('test/{0}.c', matrix.target)) }}
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_TEST_BACKEND=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz --target "$TARGET"
          [ -x "out/fuzz/$TARGET" ] || { echo "::error::$TARGET was not built"; exit 1; }
          compiler=$(clang-20 --version | head -1 | sha256sum | cut -c1-16)
          echo "CORPUS_KEY=corpus-$TARGET-$INPUTS-$compiler" >>"$GITHUB_ENV"
      - name: Restore the corpus
        id: restore
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: ${{ env.CORPUS_KEY }}-${{ github.run_id }}
          # This build's corpus, else the target's from an earlier build:
          # its inputs stay valid, and the merge re-scores them.
          restore-keys: |
            ${{ env.CORPUS_KEY }}-
            corpus-${{ matrix.target }}-
      - name: Fuzz
        # tools/fuzz_target.sh reports a finding without its input, and
        # keeps the input and the log on the runner.
        run: |
          mkdir -p "out/corpus/$TARGET"
          seeds=()
          [ -d "test/seeds/$TARGET" ] && seeds=("test/seeds/$TARGET")
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh "out/fuzz/$TARGET" -max_total_time=600 -max_len=256 \
            "out/corpus/$TARGET" "${seeds[@]}" || status=$?
          cat out/fuzz-reports/*.txt 2>/dev/null || true
          exit "$status"
      - name: Minimize the corpus
        env:
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          seeds=()
          [ -d "test/seeds/$TARGET" ] && seeds=("test/seeds/$TARGET")
          # Minimized together: the files of the seeds and the corpus that
          # keep every feature either reaches, seeds among them. The merge
          # runs every input again, so tools/fuzz_target.sh keeps its log
          # on the runner and fails on a finding, which libFuzzer's merge
          # exits 0 on; that corpus is not saved.
          rm -rf out/fuzz-reports
          status=0
          tools/fuzz_target.sh --merge "out/fuzz/$TARGET" out/merged \
            "${seeds[@]}" "out/corpus/$TARGET" || status=$?
          if [ "$status" -ne 0 ]; then
            cat out/fuzz-reports/*.txt 2>/dev/null || true
            exit "$status"
          fi
          rm -rf "out/corpus/$TARGET"
          mv out/merged "out/corpus/$TARGET"
          coverage() { "out/fuzz/$TARGET" -runs=0 "$@" 2>&1 | sed -n 's/.*INITED cov: \([0-9]*\).*/\1/p'; }
          seeded=none
          [ ${#seeds[@]} -gt 0 ] && seeded=$(coverage "${seeds[@]}")
          case "$MATCHED" in
          "") restored="none: the seeds alone" ;;
          "$CORPUS_KEY"-*) restored="this build's" ;;
          *) restored="an earlier build's" ;;
          esac
          {
            echo "| Target | Corpus restored | Seeds' coverage | Corpus's coverage | Corpus files |"
            echo "|---|---|---|---|---|"
            echo "| \`$TARGET\` | $restored | $seeded | $(coverage "${seeds[@]}" "out/corpus/$TARGET") | $(ls "out/corpus/$TARGET" | wc -l) |"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Save the corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/corpus/${{ matrix.target }}
          key: ${{ env.CORPUS_KEY }}-${{ github.run_id }}

  # The quarantined tests (docs/operations/checks.md#quarantine), which the
  # test presets leave out, of the desktop cells: Linux under AddressSanitizer
  # and UBSan, macOS and Windows, at night and on a manual run. The gamepads,
  # iOS, Android and web jobs run their own. A known flake's failure is a
  # warning; a test that did not run, a sanitizer report or a crash fails it.
  quarantine:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-clang-20-asan, runner: ubuntu-24.04 }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The CI image on Linux, as cpp.yml runs it; zizmor reads the null of the
    # macOS and Windows cells as an unpinned image.
    container: ${{ startsWith(matrix.runner, 'ubuntu') && fromJSON('{"image":"ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e","options":"--init"}') || null }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
      - name: Quarantined tests
        # The test presets' limit, which a run outside a preset does not
        # take, so a hung flake is a warning, not a cancelled job. The
        # virtual pads are the gamepads job's; Windows' build tree holds its
        # configurations side by side.
        run: |
          args=(--timeout 300)
          case "$PRESET" in
          linux-*) args+=(-LE '^uinput$') ;;
          windows-*) args+=(-C Release) ;;
          esac
          tools/run_quarantine.sh "out/$PRESET" "${args[@]}"

  # The Linux gamepads, through virtual pads the test makes with /dev/uinput,
  # every night. A container job gets no input devices, so this one runs the
  # CI image itself with the runner's uinput and input nodes passed in.
  gamepads:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Virtual gamepads
        env:
          IMAGE: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
        run: |
          sudo modprobe uinput
          [ -c /dev/uinput ] || { echo "::error::the runner has no /dev/uinput"; exit 1; }
          docker run --rm --device /dev/uinput -v /dev/input:/dev/input \
            --device-cgroup-rule='c 13:* rmw' -v "$PWD:/w" -w /w "$IMAGE" bash -c '
              set -o pipefail
              cmake --preset linux-clang-20-asan >/dev/null
              cmake --build --preset linux-clang-20-asan -j 4 >/dev/null
              ctest --test-dir out/linux-clang-20-asan -L "^uinput$" -LE "^quarantine$" \
                --output-on-failure --no-tests=error | tee out/gamepads-ctest.log'
          # A test that exits 77 (no device) passes ctest; here it must fail.
          if grep -E '\*\*\*(Skipped|Not Run)' out/gamepads-ctest.log; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Quarantined gamepad tests
        # ctest takes one -L, so the virtual pad tests are named with -R.
        env:
          IMAGE: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
        run: |
          docker run --rm --device /dev/uinput -v /dev/input:/dev/input \
            --device-cgroup-rule='c 13:* rmw' -v "$PWD:/w" -w /w \
            -e GITHUB_STEP_SUMMARY=/w/out/quarantine-summary.md "$IMAGE" bash -c '
              names=$(ctest --test-dir out/linux-clang-20-asan -N -L "^uinput$" |
                sed -n "s/^ *Test *#[0-9]*: //p" | paste -sd "|" -)
              tools/run_quarantine.sh out/linux-clang-20-asan --timeout 300 -R "^($names)$"'
          cat out/quarantine-summary.md >>"$GITHUB_STEP_SUMMARY"
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-gamepads
          path: out/linux-clang-20-asan/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The iOS backend: built with its tests on every pull request, the only
  # cell that compiles it, and run in the simulator on main and every night.
  # A simulator's boot and first launch take minutes on the macOS runners,
  # more than the pull request check's budget leaves. The headless tests run
  # through simctl spawn, the UIKit ones as applications through
  # tools/run_ios_app.sh, on an iPhone of the newest runtime; then, one
  # device booted at a time, what needs an iPad (several scenes) on an
  # iPad of that runtime.
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ccache
        # The runner has none: the release's binary, checked against its
        # published hash.
        run: |
          name=ccache-4.14.1-darwin
          curl -sSfL -o "$RUNNER_TEMP/ccache.tar.gz" \
            "https://github.com/ccache/ccache/releases/download/v4.14.1/$name.tar.gz"
          echo "c279fa81e2e806b4d9e64d4a06cb569a84ef54151feef796e5d4f4e95a464563  $RUNNER_TEMP/ccache.tar.gz" |
            shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/ccache"
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP/ccache" --strip-components=1 "$name/ccache"
          echo "$RUNNER_TEMP/ccache" >> "$GITHUB_PATH"
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-ios-simulator-${{ github.sha }}
          restore-keys: ccache-ios-simulator-
      - name: Build
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats >/dev/null
          CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_OBJC_COMPILER_LAUNCHER=ccache cmake --preset ios-simulator
          cmake --build --preset ios-simulator -j 4
          ccache --show-stats
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-ios-simulator-${{ github.sha }}
      - name: Install idb
        # ios_touch touches the window through the simulator's own input,
        # which only idb reaches: its client and companion of one release,
        # checked against their published hashes, and the client's
        # dependencies as tools/idb-requirements.txt pins them.
        if: github.event_name != 'pull_request'
        run: |
          base=https://github.com/facebook/idb/releases/download/v1.6.9
          curl -sSfL -o "$RUNNER_TEMP/fb_idb-1.6.9-py3-none-any.whl" "$base/fb_idb-1.6.9-py3-none-any.whl"
          curl -sSfL -o "$RUNNER_TEMP/idb.tar.gz" "$base/idb-companion.macos-arm64.tar.gz"
          shasum -a 256 -c - <<EOF
          400cbb1be23c407ec151d9eccbd1ed2a750d700dc6ac8dd05b7f25b43e97da17  $RUNNER_TEMP/fb_idb-1.6.9-py3-none-any.whl
          4b3ab4a8268dfb3c11d7b4ca929018b39e9ef51151e97f2af68fa2fc111c558b  $RUNNER_TEMP/idb.tar.gz
          EOF
          # Its dependencies at exact versions and hashes, then the client
          # alone, so nothing comes from PyPI unpinned.
          python3 -m pip install --break-system-packages --require-hashes -r tools/idb-requirements.txt
          python3 -m pip install --break-system-packages --no-deps "$RUNNER_TEMP/fb_idb-1.6.9-py3-none-any.whl"
          mkdir -p "$RUNNER_TEMP/idb"
          tar -xzf "$RUNNER_TEMP/idb.tar.gz" -C "$RUNNER_TEMP/idb"
          echo "$RUNNER_TEMP/idb" >> "$GITHUB_PATH"
      - name: Boot an iPhone
        if: github.event_name != 'pull_request'
        run: |
          udid=$(tools/ci_simulator.sh iPhone)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # A new device's first launch of Settings can take over four
          # minutes: paid here, not within a test's or the warm-up's timeout.
          xcrun simctl launch "$udid" com.apple.Preferences
          xcrun simctl terminate "$udid" com.apple.Preferences
          echo "MWIN_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Test
        if: github.event_name != 'pull_request'
        run: |
          ctest --preset ios-simulator -E '^ios_scenes$' | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
          # Where each application's time went, passing ones included.
          grep -E 'Testing: |^warm-up: |^installed |^launched as |^active at |^launch back |^waited until |^still in |^ended by |^phase ' \
            out/ios-simulator/Testing/Temporary/LastTest.log || true
      - name: Quarantined tests
        # On the iPhone, among the tests the preset runs but ios_scenes:
        # ctest takes one -L, so they are named with -R.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          names=$(ctest --test-dir out/ios-simulator -N -L '^(integration|base)$' |
            sed -n -e '/: ios_scenes$/d' -e 's/^ *Test *#[0-9]*: //p' | paste -sd '|' -)
          tools/run_quarantine.sh out/ios-simulator --timeout 240 -R "^($names)$"
      - name: Test on an iPad
        if: github.event_name != 'pull_request'
        run: |
          xcrun simctl shutdown "$MWIN_IOS_DEVICE"
          udid=$(tools/ci_simulator.sh iPad)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl launch "$udid" com.apple.Preferences
          xcrun simctl terminate "$udid" com.apple.Preferences
          # The window test, and the one that needs several scenes.
          MWIN_IOS_DEVICE=$udid ctest --preset ios-simulator -R '^ios(_scenes)?$' --no-tests=error |
            tee "$RUNNER_TEMP/ctest-ipad.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest-ipad.log"; then
            echo "::error::a test did not run"; exit 1
          fi
          grep -E 'Testing: |^warm-up: |^installed |^launched as |^active at |^launch back |^waited until |^still in |^ended by |^phase ' \
            out/ios-simulator/Testing/Temporary/LastTest.log || true
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-ios-simulator
          path: out/ios-simulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The Android backend in the emulator on x86_64 with KVM, in Android 11
  # (the oldest the backend takes) and Android 15 (the level the test
  # applications target, past every API level check of the backend): the
  # headless tests through adb, the window ones as applications built
  # without Gradle (tools/build_android_app.sh). The runner carries the
  # SDK. The pinned NDK comes from an Actions cache keyed by its version,
  # else from the SDK manager; the emulator and its system image come from
  # the SDK manager. Both cells build the same preset, so only Android 11's
  # saves the caches.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    env:
      API: ${{ matrix.api }}
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: NDK version
        id: ndk
        run: echo "version=${ANDROID_NDK_HOME##*/}" >> "$GITHUB_OUTPUT"
      - name: Restore the NDK
        id: ndk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
      - name: Install the NDK
        # Runner images move to newer NDKs and drop older ones: the pinned
        # one is installed when neither the image nor the cache has it.
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.ndk.outputs.version }}
        run: |
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] && exit 0
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$tools/sdkmanager" --install "ndk;$VERSION" >/dev/null
      - name: Save the NDK
        if: >-
          steps.ndk-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' && matrix.api == 30
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-$API;google_apis;x86_64"
          "$tools/sdkmanager" --install emulator "$image" >/dev/null
          echo no | "$tools/avdmanager" create avd -n "maul$API" -k "$image" -d pixel_5 >/dev/null
          # 4 GB rather than the 2 GB avdmanager gives: Android 15 runs short
          # of memory at 2 GB. Both cells get the same, so they differ only
          # in the Android version.
          nohup "$ANDROID_HOME/emulator/emulator" -avd "maul$API" -memory 4096 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install ccache
        # The runner has none: the release's static binary, checked against
        # its published hash.
        run: |
          name=ccache-4.14.1-linux-x86_64-musl-static
          curl -sSfL -o "$RUNNER_TEMP/ccache.tar.xz" \
            "https://github.com/ccache/ccache/releases/download/v4.14.1/$name.tar.xz"
          echo "fa1443c9fbea879c9bff6619d1284eda3102992e91831b9f6e546879972195cc  $RUNNER_TEMP/ccache.tar.xz" |
            sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ccache"
          tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C "$RUNNER_TEMP/ccache" --strip-components=1 "$name/ccache"
          echo "$RUNNER_TEMP/ccache" >> "$GITHUB_PATH"
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-android-emulator-${{ github.sha }}
          restore-keys: ccache-android-emulator-
      - name: Build
        # The pinned NDK is restored or installed anew by each run, so its
        # compiler's time need not match the cache's: its version names it.
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK="string:${ANDROID_NDK_HOME##*/}"
          ccache --zero-stats >/dev/null
          CMAKE_C_COMPILER_LAUNCHER=ccache cmake --preset android-emulator
          cmake --build --preset android-emulator -j 4
          ccache --show-stats
      - name: Save ccache
        if: >-
          always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          matrix.api == 30
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-android-emulator-${{ github.sha }}
      - name: Test
        run: |
          ctest --preset android-emulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Quarantined tests
        # Tests that failed intermittently run here every night, outside the
        # required check, until their issue is fixed (the quarantine label).
        # A failure is a known flake, reported as a warning; a skip, a test
        # not run, a sanitizer report or a crash fails the step.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: tools/run_quarantine.sh out/android-emulator --timeout 240
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-emulator-${{ matrix.api }}
          path: out/android-emulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The web backend without Emscripten: Clang's wasm32-wasi, every test a
  # module in headless Chrome through puppeteer, with the JavaScript imports
  # the build generates.
  web-wasi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/rawframe-project/ci-cpp:2026.10.7@sha256:08c846597243dc000c83d6c008d078a8c3fabf8633d83963d46c0e6d02c2577e
      options: --init
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-web-wasi-${{ github.sha }}
          restore-keys: ccache-web-wasi-
      - name: Build
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats >/dev/null
          CMAKE_C_COMPILER_LAUNCHER=ccache cmake --preset web-wasi
          cmake --build --preset web-wasi -j 4
          ccache --show-stats
      - name: Save ccache
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-web-wasi-${{ github.sha }}
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
      - name: Test
        run: |
          MWIN_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" ctest --preset web-wasi |
            tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Quarantined tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          MWIN_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" \
            tools/run_quarantine.sh out/web-wasi --timeout 300
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-wasi
          path: out/web-wasi/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The web backend built by Emscripten, its tests in headless Chrome through
  # puppeteer, and what the backend costs a program. The CI image has no
  # Emscripten, so this job uses the runner and the emsdk action.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
      - name: Test
        run: |
          MWIN_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" ctest --preset web-emscripten |
            tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Quarantined tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          MWIN_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" \
            tools/run_quarantine.sh out/web-emscripten --timeout 300
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        # The library, and what the web backend costs a program: the same
        # test program's wasm and JavaScript with the backend and without.
        run: |
          ls -l out/web-emscripten/libmaul-window.a
          emcmake cmake -B out/web-none -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WEB=OFF >/dev/null
          cmake --build out/web-none -j 4 --target test_window >/dev/null
          for kind in wasm js; do
            with=$(stat -c %s out/web-emscripten/test_window.$kind)
            without=$(stat -c %s out/web-none/test_window.$kind)
            echo "test_window.$kind  $with bytes, the web backend $((with - without))"
          done

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, msvc-headers, fuzz, quarantine, ios-simulator, android-emulator, web-wasi, web-emscripten]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
