# Continuous integration for Maul Window.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_WINDOW

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # A mirror's stalled download is retried; a hang ends here.
        timeout-minutes: 15
        run: |
          bash .github/apt-mirrors.sh
          sudo apt-get update -q
          # clang without its recommends: llvm-20-dev alone is 50 MB.
          sudo apt-get install -y -q --no-install-recommends clang-20 clang-tidy-20
          sudo apt-get install -y -q --no-install-recommends ninja-build libwayland-dev \
            wayland-protocols libxkbcommon-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxcb-xinput-dev libxkbcommon-x11-dev libxcb-xtest0-dev libxcb-xfixes0-dev
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          # Files kept as published (tools/external-dirs.txt) are left out.
          external=$(grep -v '^#' tools/external-dirs.txt | sed 's|$|/|' | paste -sd'|')
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null | grep -v -E "^($external)")
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: API reference
        # docs/api.md is what the generator makes from the headers, and
        # the README gives its function count.
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }
      - name: Generated tables
        # The gamepad mappings and Android's key table are what the
        # generators make from the data.
        run: |
          python3 tools/gen_gamepad_db.py Linux /tmp/pad_linux.c
          diff -u src/generated/pad_linux.c /tmp/pad_linux.c
          python3 tools/gen_gamepad_db.py Windows /tmp/pad_windows.c
          diff -u src/generated/pad_windows.c /tmp/pad_windows.c
          python3 tools/gen_android_keys.py /tmp/android_keys.c
          diff -u src/generated/android_keys.c /tmp/android_keys.c
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build  # the generated protocol headers
          # The sources of the Linux build; Windows code is checked by its cell.
          for f in $(python3 -c "import json; print('\n'.join(sorted({e['file'] for e in json.load(open('build/compile_commands.json')) if '/src/' in e['file'] and '_deps' not in e['file'] and '/generated/' not in e['file']})))"); do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_WINDOW_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_WINDOW_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_WINDOW_BUILD_SHARED=ON" }
          - { name: linux-minimal,       os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "-DMAUL_WINDOW_WAYLAND=OFF -DMAUL_WINDOW_X11=OFF -DMAUL_WINDOW_GAMEPAD=OFF" }
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        if: runner.os == 'Linux'
        # A mirror's stalled download is retried; a hang ends here.
        timeout-minutes: 15
        run: |
          bash .github/apt-mirrors.sh
          sudo apt-get update -q
          # clang without its recommends (llvm-20-dev alone is 50 MB, which a
          # slow mirror took past the timeout), with the sanitizers' runtime.
          sudo apt-get install -y -q --no-install-recommends clang-20 libclang-rt-20-dev
          # The rest without theirs too: weston's pulled in Mesa's Vulkan and
          # video drivers, GStreamer and a 27 MB speech model.
          sudo apt-get install -y -q --no-install-recommends gcc-14 g++-14 ninja-build \
            libwayland-dev wayland-protocols libxkbcommon-dev xkb-data libx11-data weston libxcb1-dev \
            libxcb-randr0-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libxcb-xtest0-dev libxcb-xfixes0-dev xvfb
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Start a headless compositor and X server
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          mkdir -m 700 -p /tmp/xdg-runtime
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=/tmp/xdg-runtime weston --backend=headless --socket=wayland-ci \
            --idle-time=0 >/tmp/weston.log 2>&1 &
          for i in $(seq 50); do [ -S /tmp/xdg-runtime/wayland-ci ] && exit 0; sleep 0.1; done
          cat /tmp/weston.log; exit 1
      - name: Let the tests make virtual gamepads
        if: runner.os == 'Linux'
        run: |
          sudo modprobe uinput || true
          printf '%s\n' 'KERNEL=="uinput", MODE="0666"' \
            'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' |
            sudo tee /etc/udev/rules.d/99-mwin-test.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/uinput || true
      - name: Test
        # A skipped test fails the step: a platform that failed to start
        # would otherwise pass with nothing tested.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi

  # Each fuzz target runs for one minute on every push, over the parsers
  # of bytes other programs and devices hand the library.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        # A mirror's stalled download is retried; a hang ends here. Without
        # clang's recommends (llvm-20-dev alone is 50 MB, which a slow
        # mirror took past the timeout); libFuzzer's runtime is one of them.
        timeout-minutes: 15
        run: |
          bash .github/apt-mirrors.sh
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-20 libclang-rt-20-dev \
            ninja-build libwayland-dev wayland-protocols libxkbcommon-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_TEST_BACKEND=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          for target in build/fuzz_*; do
            mkdir -p "corpus-$(basename $target)"
            "$target" -max_total_time=60 -max_len=256 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        # A skipped test fails the step: a platform that failed to start
        # would otherwise pass with nothing tested.
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  ios:
    # The iOS backend (mwin-0025) in the simulator: every test, the
    # headless ones through simctl spawn, the UIKit ones as applications
    # through tools/run_ios_app.sh, on an iPhone of the newest runtime.
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # A new device's first launch takes minutes: paid here.
          xcrun simctl launch "$udid" com.apple.Preferences
          xcrun simctl terminate "$udid" com.apple.Preferences
          echo "MWIN_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/ios-simulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # A skipped test fails the step: a platform that failed to start
        # would otherwise pass with nothing tested.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 240 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi

  android:
    # The Android backend (mwin-0026) in the emulator, Android 11 (the
    # oldest the backend takes) on x86_64 with KVM: every test, the
    # headless ones through adb, the window ones as applications built
    # without Gradle (tools/build_android_app.sh). The runner carries the
    # SDK and NDK r28; the emulator and its image are installed here.
    name: android-emulator
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      # Where avdmanager writes the device and the emulator reads it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v7
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed when
          # the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-30;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maul30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maul30 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/android-emulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # A skipped test fails the step: a platform that failed to start
        # would otherwise pass with nothing tested.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 240 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi

  web-wasi:
    # The web without Emscripten (mwin-0022): Clang's wasm32-wasi, every
    # test under Node's WASI and the browser tests in headless Chrome.
    name: web-wasi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        # A mirror's stalled download is retried; a hang ends here.
        timeout-minutes: 15
        run: |
          bash .github/apt-mirrors.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-20 lld-20 wasi-libc \
            libclang-rt-20-dev-wasm32
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/wasm32-wasi.cmake -DCMAKE_C_COMPILER=clang-20
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Browser
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test
        # A skipped test fails the step: a platform that failed to start
        # would otherwise pass with nothing tested.
        run: |
          set -o pipefail
          MWIN_NODE_MODULES=/tmp/browser/node_modules ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Browser
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test
        # A skipped test fails the step: a platform that failed to start
        # would otherwise pass with nothing tested.
        run: |
          set -o pipefail
          MWIN_NODE_MODULES=/tmp/browser/node_modules ctest --test-dir build --output-on-failure --timeout 300 2>&1 | tee ctest.log
          if grep -q "(Skipped)" ctest.log; then echo "::error::a test was skipped"; exit 1; fi
      - name: Size
        # The library, and what the web backend costs a program: the same
        # test program's wasm and JavaScript with the backend and without.
        run: |
          ls -l build/libmaul-window.a
          emcmake cmake -B build-noweb -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WEB=OFF >/dev/null
          cmake --build build-noweb -j 4 --target test_window >/dev/null
          for kind in wasm js; do
            with=$(stat -c %s build/test_window.$kind)
            without=$(stat -c %s build-noweb/test_window.$kind)
            echo "test_window.$kind  $with bytes, the web backend $((with - without))"
          done
