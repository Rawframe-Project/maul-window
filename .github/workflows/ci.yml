# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer. Each desktop build cell is a
# CMake preset built by the organization's shared workflow; the platform
# cells that need a simulator, an emulator or a browser, and the other
# jobs, are here, each through its preset too. docs/operations/checks.md
# explains each job, and tools/check.sh runs the Linux ones locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PREFIX: MAUL_WINDOW

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@2f63b13b7b6ff73a19fb04e7fa9c9e559ee44491 # v0.0.5
    permissions:
      pull-requests: read

  # The organization's documentation check. protocols/, tools/gamepaddb/ and
  # tools/androidkeys/ hold third-party files kept as published.
  docs:
    uses: Rawframe-Project/.github/.github/workflows/docs-check.yml@2f63b13b7b6ff73a19fb04e7fa9c9e559ee44491 # v0.0.5
    permissions:
      contents: read
    with:
      exclude: protocols tools/gamepaddb tools/androidkeys

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@2f63b13b7b6ff73a19fb04e7fa9c9e559ee44491 # v0.0.5
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the documentation site,
  # the generated tables, and clang-tidy over the Linux build's sources. It
  # runs on documentation changes too, since the snippet check and the site
  # read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.3@sha256:af7335beac5206f116bc82f9b44538bc633395bd0c10d933012c41f56326e0fc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files 'include/*.h' 'src/*.[chm]' 'test/*.[chm]' 'tools/*.[ch]' 'bench/*.[ch]' 'samples/*.[ch]' |
            grep -v -E '^(tools/gamepaddb|tools/androidkeys)/' | xargs clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: Generated tables match their generators
        run: |
          mkdir -p out/regenerated
          python3 tools/gen_gamepad_db.py Linux out/regenerated/pad_linux.c
          python3 tools/gen_gamepad_db.py Windows out/regenerated/pad_windows.c
          python3 tools/gen_android_keys.py out/regenerated/android_keys.c
          for f in pad_linux.c pad_windows.c android_keys.c; do
            diff -u "src/generated/$f" "out/regenerated/$f"
          done
      - name: clang-tidy
        # The Linux build's sources; the other platforms' code is compiled
        # with warnings as errors by its own cell.
        run: |
          cmake -B out/tidy -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D${PREFIX}_BUILD_TESTS=OFF
          cmake --build out/tidy
          python3 -c "import json; print('\n'.join(sorted({e['file'] for e in json.load(open('out/tidy/compile_commands.json')) if '/src/' in e['file'] and '_deps' not in e['file'] and '/generated/' not in e['file']})))" |
            while read -r f; do clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*' "$f"; done

  # Every cell builds with warnings as errors and runs its whole suite, the
  # header tests included. The Linux cells run the X11 and Wayland tests
  # against an Xvfb and a headless weston that ctest starts for them.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14 }
          - { preset: linux-clang-20 }
          - { preset: linux-clang-20-asan, repeat: 3 }
          - { preset: linux-clang-20-tsan }
          - { preset: linux-shared }
          - { preset: linux-minimal }
          - { preset: macos-clang, runner: macos-15 }
          - { preset: windows-clang-cl, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@2f63b13b7b6ff73a19fb04e7fa9c9e559ee44491 # v0.0.5
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # Each fuzz target runs over the bytes other programs and devices hand
  # the library: briefly on a pull request, longer on main and at night.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.3@sha256:af7335beac5206f116bc82f9b44538bc633395bd0c10d933012c41f56326e0fc
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 20 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_TEST_BACKEND=ON -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build out/fuzz
      - name: Run
        run: |
          for target in out/fuzz/fuzz_*; do
            name=$(basename "$target")
            mkdir -p "out/corpus/$name"
            "$target" -max_total_time="$FUZZ_SECONDS" -max_len=256 "out/corpus/$name"
          done

  # The Linux gamepads, through virtual pads the test makes with /dev/uinput,
  # every night. A container job gets no input devices, so this one runs the
  # CI image itself with the runner's uinput and input nodes passed in.
  gamepads:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Virtual gamepads
        env:
          IMAGE: ghcr.io/rawframe-project/ci-cpp:2026.10.3@sha256:af7335beac5206f116bc82f9b44538bc633395bd0c10d933012c41f56326e0fc
        run: |
          sudo modprobe uinput
          [ -c /dev/uinput ] || { echo "::error::the runner has no /dev/uinput"; exit 1; }
          docker run --rm --device /dev/uinput -v /dev/input:/dev/input \
            --device-cgroup-rule='c 13:* rmw' -v "$PWD:/w" -w /w "$IMAGE" bash -c '
              set -o pipefail
              cmake --preset linux-clang-20-asan >/dev/null
              cmake --build --preset linux-clang-20-asan -j 4 >/dev/null
              ctest --test-dir out/linux-clang-20-asan -L "^uinput$" --output-on-failure --no-tests=error |
                tee out/gamepads-ctest.log'
          # A test that exits 77 (no device) passes ctest; here it must fail.
          if grep -E '\*\*\*(Skipped|Not Run)' out/gamepads-ctest.log; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-gamepads
          path: out/linux-clang-20-asan/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The iOS backend in the simulator: the headless tests through simctl
  # spawn, the UIKit ones as applications through tools/run_ios_app.sh, on
  # an iPhone of the newest runtime.
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          echo "MWIN_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
          # Booting and a new device's first launch take minutes, so they run
          # while the next step builds, and a test never pays for them.
          (xcrun simctl bootstatus "$udid" -b &&
            xcrun simctl launch "$udid" com.apple.Preferences &&
            xcrun simctl terminate "$udid" com.apple.Preferences &&
            touch "$RUNNER_TEMP/booted") >"$RUNNER_TEMP/boot.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/boot.pid"
      - name: Build
        run: |
          cmake --preset ios-simulator
          cmake --build --preset ios-simulator -j 4
      - name: Wait for the simulator
        timeout-minutes: 12
        run: |
          pid=$(cat "$RUNNER_TEMP/boot.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          [ -f "$RUNNER_TEMP/booted" ] || { cat "$RUNNER_TEMP/boot.log"; exit 1; }
      - name: Test
        run: |
          ctest --preset ios-simulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-ios-simulator
          path: out/ios-simulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The Android backend in the emulator, Android 11 (the oldest the backend
  # takes) on x86_64 with KVM: the headless tests through adb, the window
  # ones as applications built without Gradle (tools/build_android_app.sh).
  # The runner carries the SDK and the NDK; the emulator and its system image
  # come from the SDK manager.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed
          # when the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-30;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maul30 -k "system-images;android-30;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maul30 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake --preset android-emulator
          cmake --build --preset android-emulator -j 4
      - name: Test
        run: |
          ctest --preset android-emulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Quarantined tests
        # Tests that failed intermittently run here every night, outside the
        # required check, until their issue is fixed (the quarantine label).
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          ctest --test-dir out/android-emulator -L '^quarantine$' --output-on-failure --timeout 240 \
            --no-tests=error | tee "$RUNNER_TEMP/quarantine.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/quarantine.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-emulator
          path: out/android-emulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The web backend without Emscripten: Clang's wasm32-wasi, every test a
  # module in headless Chrome through puppeteer, with the JavaScript imports
  # the build generates.
  web-wasi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.3@sha256:af7335beac5206f116bc82f9b44538bc633395bd0c10d933012c41f56326e0fc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset web-wasi
          cmake --build --preset web-wasi -j 4
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
      - name: Test
        run: |
          MWIN_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" ctest --preset web-wasi |
            tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-wasi
          path: out/web-wasi/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # The web backend built by Emscripten, its tests in headless Chrome through
  # puppeteer, and what the backend costs a program. The CI image has no
  # Emscripten, so this job uses the runner and the emsdk action.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Build
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten -j 4
      - name: Browser
        # puppeteer and its dependencies as test/browser's lockfile pins them.
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cp test/browser/package.json test/browser/package-lock.json "$RUNNER_TEMP/browser/"
          npm ci --prefix "$RUNNER_TEMP/browser"
      - name: Test
        run: |
          MWIN_NODE_MODULES="$RUNNER_TEMP/browser/node_modules" ctest --preset web-emscripten |
            tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Size
        # The library, and what the web backend costs a program: the same
        # test program's wasm and JavaScript with the backend and without.
        run: |
          ls -l out/web-emscripten/libmaul-window.a
          emcmake cmake -B out/web-none -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WEB=OFF >/dev/null
          cmake --build out/web-none -j 4 --target test_window >/dev/null
          for kind in wasm js; do
            with=$(stat -c %s out/web-emscripten/test_window.$kind)
            without=$(stat -c %s out/web-none/test_window.$kind)
            echo "test_window.$kind  $with bytes, the web backend $((with - without))"
          done

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped for a documentation-only change, so adding or
  # renaming a job never touches the ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, msvc-headers, fuzz, ios-simulator, android-emulator, web-wasi, web-emscripten]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
